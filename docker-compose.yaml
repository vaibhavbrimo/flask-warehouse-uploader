version: '3.8'

x-flask-common:
  &flask-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${FLASK_IMAGE_NAME:-flask-warehouse-uploader:latest}
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &flask-common-env
    FLASK_ENV: ${FLASK_ENV:-production}
    FLASK_APP: app.py
    PYTHONUNBUFFERED: "1"
    UPLOAD_FOLDER: "/app/uploads"
    # Airflow API Configuration
    AIRFLOW_API_URL: ${AIRFLOW_API_URL:-http://localhost:8080/api/v1/dags/etl_gokwik_csv_to_bronze/dagRuns}
    AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-airflow}
    AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
  volumes:
    # MAGIC: Mount Airflow's data folder using an environment variable from .env
    - ${SHARED_VOLUME_PATH:-/tmp/gokwik_reports}:/app/uploads
  restart: unless-stopped

services:
  flask-app:
    <<: *flask-common
    container_name: flask-warehouse-uploader
    ports:
      - "${FLASK_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
