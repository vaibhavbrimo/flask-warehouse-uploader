<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Warehouse | Gokwik Ingestion Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2 1.5 3 3.5 3h9c2 0 3.5-1 3.5-3V7M4 7c0-2 1.5-3 3.5-3h9c2 0 3.5 1 3.5 3M4 7h16M10 11h4m-4 4h4" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 leading-tight">OrderRecon Hub</h1>
                    <p class="text-xs text-slate-500 font-medium">AWS S3 File Ingestion Portal</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-medium flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>S3: Active</span>
                </span>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-6 py-10">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-slate-900">Upload Gokwik Orders Report</h2>
            <p class="text-sm text-slate-500 mt-1">Files are uploaded directly and securely archived to AWS S3 bucket.</p>
        </div>

        <!-- Uploader Card -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
            
            <div id="drop-zone" class="border-2 border-dashed border-slate-300 hover:border-indigo-500 bg-slate-50/50 hover:bg-indigo-50/30 rounded-2xl p-10 text-center cursor-pointer transition">
                <input type="file" id="file-input" accept=".csv" class="hidden">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-400">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                </div>
                <p class="text-sm font-semibold text-slate-800">Drop Gokwik CSV here, or <span class="text-indigo-600 underline">browse</span></p>
                <p class="text-xs text-slate-400 mt-1">Supports UTF-8 CSV exports up to 100MB</p>
            </div>

            <!-- Preview Card -->
            <div id="file-preview-card" class="hidden mt-6 p-4 rounded-xl bg-slate-50 border border-slate-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p id="file-name" class="text-sm font-semibold text-slate-800 truncate max-w-xs">orders.csv</p>
                        <p id="file-size" class="text-xs text-slate-500">1.2 MB</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="cancel-btn" class="px-3 py-1.5 text-xs text-slate-600 hover:text-rose-600">Remove</button>
                        <button id="upload-btn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow">
                            Upload to AWS & Sync
                        </button>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div id="progress-wrapper" class="hidden mt-4 pt-4 border-t border-slate-200">
                    <div class="flex justify-between text-xs text-slate-500 mb-1">
                        <span id="progress-text">Uploading to AWS S3...</span>
                        <span id="progress-val">40%</span>
                    </div>
                    <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-indigo-600 rounded-full transition-all duration-300" style="width: 40%"></div>
                    </div>
                </div>
            </div>

            <div id="alert-box" class="hidden mt-6 p-4 rounded-xl text-sm font-medium"></div>

        </div>

        <!-- Redash Banner
        <div class="mt-8 bg-slate-900 text-white rounded-2xl p-6 flex items-center justify-between">
            <div>
                <h4 class="text-sm font-bold">View Reconciliation Dashboard</h4>
                <p class="text-xs text-slate-400 mt-0.5">Check discrepancies and C2P conversions on Redash.</p>
            </div>
            <a href="http://localhost:5001" target="_blank" class="px-4 py-2 bg-white text-slate-900 rounded-xl text-xs font-semibold hover:bg-slate-100">
                Open Redash →
            </a>
        </div> -->
    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const filePreviewCard = document.getElementById('file-preview-card');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const cancelBtn = document.getElementById('cancel-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const progressWrapper = document.getElementById('progress-wrapper');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressVal = document.getElementById('progress-val');
        const alertBox = document.getElementById('alert-box');

        let selectedFile = null;

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500', 'bg-indigo-50/40'); };
        dropZone.ondragleave = () => dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/40');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/40');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        };

        function handleFile(file) {
            if (!file.name.toLowerCase().endsWith('.csv')) {
                showAlert('Please select a valid .csv file.', false);
                return;
            }
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
            filePreviewCard.classList.remove('hidden');
            progressWrapper.classList.add('hidden');
            alertBox.classList.add('hidden');
        }

        cancelBtn.onclick = () => {
            selectedFile = null;
            fileInput.value = '';
            filePreviewCard.classList.add('hidden');
        };

        uploadBtn.onclick = async () => {
            if (!selectedFile) return;

            uploadBtn.disabled = true;
            cancelBtn.disabled = true;
            progressWrapper.classList.remove('hidden');
            alertBox.classList.add('hidden');

            setProgress(40, 'Uploading to AWS S3 Bucket...');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    setProgress(100, 'Upload Completed!');
                    showAlert(data.message, true);
                    filePreviewCard.classList.add('hidden');
                } else {
                    showAlert(data.message || 'Upload failed.', false);
                }
            } catch (err) {
                showAlert('Network error or server down.', false);
            } finally {
                uploadBtn.disabled = false;
                cancelBtn.disabled = false;
            }
        };

        function setProgress(pct, text) {
            progressBar.style.width = pct + '%';
            progressVal.textContent = pct + '%';
            progressText.textContent = text;
        }

        function showAlert(msg, isSuccess) {
            alertBox.textContent = msg;
            alertBox.className = `mt-6 p-4 rounded-xl text-sm font-medium ${
                isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'
            }`;
            alertBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
